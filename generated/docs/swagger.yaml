basePath: /v1
definitions:
  generated.Compatibility:
    properties:
      note:
        type: string
      state:
        $ref: '#/definitions/generated.CompatibilityState'
    type: object
  generated.CompatibilityInfo:
    properties:
      EA:
        $ref: '#/definitions/generated.Compatibility'
      EXP:
        $ref: '#/definitions/generated.Compatibility'
    type: object
  generated.CompatibilityState:
    enum:
    - Works
    - Damaged
    - Broken
    type: string
    x-enum-varnames:
    - CompatibilityStateWorks
    - CompatibilityStateDamaged
    - CompatibilityStateBroken
  generated.Group:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  generated.Guide:
    properties:
      created_at:
        type: string
      guide:
        type: string
      id:
        type: string
      name:
        type: string
      short_description:
        type: string
      tags:
        items:
          $ref: '#/definitions/generated.Tag'
        type: array
      updated_at:
        type: string
      user:
        $ref: '#/definitions/generated.User'
      user_id:
        type: string
      views:
        type: integer
    type: object
  generated.LatestVersions:
    properties:
      alpha:
        $ref: '#/definitions/generated.Version'
      beta:
        $ref: '#/definitions/generated.Version'
      release:
        $ref: '#/definitions/generated.Version'
    type: object
  generated.Mod:
    properties:
      approved:
        type: boolean
      authors:
        items:
          $ref: '#/definitions/generated.UserMod'
        type: array
      compatibility:
        $ref: '#/definitions/generated.CompatibilityInfo'
      created_at:
        type: string
      creator_id:
        type: string
      downloads:
        type: integer
      full_description:
        type: string
      hidden:
        type: boolean
      hotness:
        type: integer
      id:
        type: string
      last_version_date:
        type: string
      latestVersions:
        $ref: '#/definitions/generated.LatestVersions'
      logo:
        type: string
      logo_thumbhash:
        type: string
      mod_reference:
        type: string
      name:
        type: string
      popularity:
        type: integer
      short_description:
        type: string
      source_url:
        type: string
      tags:
        items:
          $ref: '#/definitions/generated.Tag'
        type: array
      toggle_explicit_content:
        type: boolean
      toggle_network_use:
        type: boolean
      updated_at:
        type: string
      version:
        $ref: '#/definitions/generated.Version'
      versions:
        items:
          $ref: '#/definitions/generated.Version'
        type: array
      views:
        type: integer
    type: object
  generated.Modpack:
    properties:
      children:
        items:
          $ref: '#/definitions/generated.Modpack'
        type: array
      compatibility:
        $ref: '#/definitions/generated.CompatibilityInfo'
      created_at:
        type: string
      creator:
        $ref: '#/definitions/generated.User'
      creator_id:
        type: string
      full_description:
        type: string
      hidden:
        type: boolean
      hotness:
        type: integer
      id:
        type: string
      installs:
        type: integer
      logo:
        type: string
      logo_thumbhash:
        type: string
      mods:
        items:
          $ref: '#/definitions/generated.ModpackModEntry'
        type: array
      name:
        type: string
      parent:
        $ref: '#/definitions/generated.Modpack'
      parent_id:
        type: string
      popularity:
        type: integer
      releases:
        items:
          $ref: '#/definitions/generated.ModpackRelease'
        type: array
      short_description:
        type: string
      tags:
        items:
          $ref: '#/definitions/generated.Tag'
        type: array
      targets:
        items:
          type: string
        type: array
      updated_at:
        type: string
      views:
        type: integer
    type: object
  generated.ModpackModEntry:
    properties:
      mod_id:
        type: string
      version_constraint:
        type: string
    type: object
  generated.ModpackRelease:
    properties:
      changelog:
        type: string
      created_at:
        type: string
      id:
        type: string
      lockfile:
        type: string
      version:
        type: string
    type: object
  generated.Tag:
    properties:
      description:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  generated.TargetName:
    enum:
    - Windows
    - WindowsServer
    - LinuxServer
    type: string
    x-enum-varnames:
    - TargetNameWindows
    - TargetNameWindowsServer
    - TargetNameLinuxServer
  generated.User:
    properties:
      avatar:
        type: string
      avatar_thumbhash:
        type: string
      created_at:
        type: string
      email:
        type: string
      facebook_id:
        type: string
      github_id:
        type: string
      google_id:
        type: string
      groups:
        items:
          $ref: '#/definitions/generated.Group'
        type: array
      guides:
        items:
          $ref: '#/definitions/generated.Guide'
        type: array
      id:
        type: string
      mods:
        items:
          $ref: '#/definitions/generated.UserMod'
        type: array
      roles:
        $ref: '#/definitions/generated.UserRoles'
      username:
        type: string
    type: object
  generated.UserMod:
    properties:
      mod:
        $ref: '#/definitions/generated.Mod'
      mod_id:
        type: string
      role:
        type: string
      user:
        $ref: '#/definitions/generated.User'
      user_id:
        type: string
    type: object
  generated.UserRoles:
    properties:
      approveMods:
        type: boolean
      approveVersions:
        type: boolean
      deleteContent:
        type: boolean
      editAnyModCompatibility:
        type: boolean
      editBootstrapVersions:
        type: boolean
      editContent:
        type: boolean
      editSatisfactoryVersions:
        type: boolean
      editUsers:
        type: boolean
    type: object
  generated.Version:
    properties:
      approved:
        type: boolean
      changelog:
        type: string
      created_at:
        type: string
      dependencies:
        items:
          $ref: '#/definitions/generated.VersionDependency'
        type: array
      downloads:
        type: integer
      game_version:
        type: string
      hash:
        type: string
      id:
        type: string
      link:
        type: string
      metadata:
        type: string
      mod:
        $ref: '#/definitions/generated.Mod'
      mod_id:
        type: string
      required_on_remote:
        type: boolean
      size:
        type: integer
      sml_version:
        type: string
      stability:
        $ref: '#/definitions/generated.VersionStabilities'
      targets:
        items:
          $ref: '#/definitions/generated.VersionTarget'
        type: array
      updated_at:
        type: string
      version:
        type: string
      virustotal_results:
        items:
          $ref: '#/definitions/generated.VirustotalResult'
        type: array
    type: object
  generated.VersionDependency:
    properties:
      condition:
        type: string
      mod:
        $ref: '#/definitions/generated.Mod'
      mod_id:
        type: string
      mod_reference:
        type: string
      optional:
        type: boolean
      version:
        $ref: '#/definitions/generated.Version'
      version_id:
        type: string
    type: object
  generated.VersionStabilities:
    enum:
    - alpha
    - beta
    - release
    type: string
    x-enum-varnames:
    - VersionStabilitiesAlpha
    - VersionStabilitiesBeta
    - VersionStabilitiesRelease
  generated.VersionTarget:
    properties:
      VersionID:
        type: string
      hash:
        type: string
      link:
        type: string
      size:
        type: integer
      targetName:
        $ref: '#/definitions/generated.TargetName'
    type: object
  generated.VirustotalResult:
    properties:
      created_at:
        type: string
      file_name:
        type: string
      hash:
        type: string
      id:
        type: string
      safe:
        type: boolean
      updated_at:
        type: string
      version_id:
        type: string
    type: object
  nodes.ErrorResponse:
    properties:
      code:
        type: integer
      message:
        type: string
    type: object
  nodes.GenericResponse:
    properties:
      data: {}
      error: {}
      success:
        type: boolean
    type: object
host: api.ficsit.app
info:
  contact: {}
  description: Satisfactory Mod Repo API documentation.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: Satisfactory Mod Repo API
  version: "1"
paths:
  /mod/{modId}:
    get:
      consumes:
      - application/json
      description: Retrieve a mod by mod ID
      parameters:
      - description: Mod ID
        in: path
        name: modId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Retrieve a Mod
      tags:
      - Mod
  /mod/{modId}/authors:
    get:
      consumes:
      - application/json
      description: Retrieve a mod authors by mod ID
      parameters:
      - description: Mod ID
        in: path
        name: modId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Retrieve a Mod Authors
      tags:
      - Mod
  /mod/{modId}/latest-versions:
    get:
      consumes:
      - application/json
      description: Retrieve a list of latest versions for a mod based on mod id
      parameters:
      - description: Mod ID
        in: path
        name: modId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Retrieve a list of latest versions for a mod
      tags:
      - Mod
  /mod/{modId}/versions:
    get:
      consumes:
      - application/json
      description: Retrieve a mod versions by mod ID
      parameters:
      - description: How many versions to return
        in: query
        name: limit
        type: integer
      - description: Offset for list of versions to return
        in: query
        name: offset
        type: integer
      - description: Order by field
        enum:
        - created_at
        - updated_at
        in: query
        name: order_by
        type: string
      - description: Order of results
        enum:
        - asc
        - desc
        in: query
        name: order
        type: string
      - description: Mod ID
        in: path
        name: modId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Retrieve a Mod Versions
      tags:
      - Mod
  /mod/{modId}/versions/{versionId}:
    get:
      consumes:
      - application/json
      description: Retrieve a mod version by mod ID and version ID
      parameters:
      - description: Mod ID
        in: path
        name: modId
        required: true
        type: string
      - description: Version ID
        in: path
        name: versionId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Retrieve a Mod Version
      tags:
      - Mod
  /mod/{modId}/versions/{versionId}/{target}/download:
    get:
      consumes:
      - application/json
      description: Download a mod version by mod ID and version ID and TargetName
      parameters:
      - description: Mod ID
        in: path
        name: modId
        required: true
        type: string
      - description: Version ID
        in: path
        name: versionId
        required: true
        type: string
      - description: TargetName
        in: path
        name: target
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Download a Mod Version by TargetName
      tags:
      - Mod
  /mod/{modId}/versions/{versionId}/download:
    get:
      consumes:
      - application/json
      description: Download a mod version by mod ID and version ID
      parameters:
      - description: Mod ID
        in: path
        name: modId
        required: true
        type: string
      - description: Version ID
        in: path
        name: versionId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Download a Mod Version
      tags:
      - Mod
  /mod/{modId}/versions/all:
    get:
      consumes:
      - application/json
      description: Retrieve all mod versions by mod ID
      parameters:
      - description: Mod ID
        in: path
        name: modId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Retrieve all Mod Versions
      tags:
      - Mod
  /modpacks:
    get:
      consumes:
      - application/json
      description: Retrieve a list of modpacks
      parameters:
      - description: How many modpacks to return
        in: query
        name: limit
        type: integer
      - description: Offset for list of modpacks to return
        in: query
        name: offset
        type: integer
      - description: Order by field
        enum:
        - created_at
        - updated_at
        - name
        - views
        - installs
        - hotness
        - popularity
        - search
        in: query
        name: order_by
        type: string
      - description: Order of results
        enum:
        - asc
        - desc
        in: query
        name: order
        type: string
      - description: Search string
        in: query
        name: search
        type: string
      - description: Include hidden modpacks
        in: query
        name: hidden
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/nodes.GenericResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/generated.Modpack'
                  type: array
              type: object
      summary: Retrieve a list of Modpacks
      tags:
      - Modpacks
  /modpacks/{modpackId}:
    get:
      consumes:
      - application/json
      description: Retrieve a single modpack by ID
      parameters:
      - description: Modpack ID
        in: path
        name: modpackId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/nodes.GenericResponse'
            - properties:
                data:
                  $ref: '#/definitions/generated.Modpack'
              type: object
        "404":
          description: Not Found
          schema:
            allOf:
            - $ref: '#/definitions/nodes.GenericResponse'
            - properties:
                error:
                  $ref: '#/definitions/nodes.ErrorResponse'
              type: object
      summary: Retrieve a single Modpack
      tags:
      - Modpacks
  /modpacks/{modpackId}/releases/{version}:
    get:
      consumes:
      - application/json
      description: Retrieve a specific release of a modpack
      parameters:
      - description: Modpack ID
        in: path
        name: modpackId
        required: true
        type: string
      - description: Release Version
        in: path
        name: version
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/nodes.GenericResponse'
            - properties:
                data:
                  $ref: '#/definitions/generated.ModpackRelease'
              type: object
        "404":
          description: Not Found
          schema:
            allOf:
            - $ref: '#/definitions/nodes.GenericResponse'
            - properties:
                error:
                  $ref: '#/definitions/nodes.ErrorResponse'
              type: object
      summary: Retrieve a Modpack Release
      tags:
      - Modpacks
  /mods:
    get:
      consumes:
      - application/json
      description: Retrieve a list of mods
      parameters:
      - description: How many mods to return
        in: query
        name: limit
        type: integer
      - description: Offset for list of mods to return
        in: query
        name: offset
        type: integer
      - description: Order by field
        enum:
        - created_at
        - updated_at
        - name
        - views
        - downloads
        - hotness
        - popularity
        - last_version_date
        in: query
        name: order_by
        type: string
      - description: Order of results
        enum:
        - asc
        - desc
        in: query
        name: order
        type: string
      - description: Search string
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Retrieve a list of Mods
      tags:
      - Mods
  /mods/{modIds}:
    get:
      consumes:
      - application/json
      description: Retrieve a list of mods by mod IDs
      parameters:
      - description: Mod IDs
        in: path
        name: modIds
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Retrieve a list of Mods by ID
      tags:
      - Mods
  /mods/{modIds}/latest-versions:
    get:
      consumes:
      - application/json
      description: Retrieve a list of latest versions for mods based on mod id
      parameters:
      - description: Mod IDs
        in: path
        name: modIds
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Retrieve a list of latest versions for mods
      tags:
      - Mods
  /mods/count:
    get:
      consumes:
      - application/json
      description: Retrieve a count of Mods
      parameters:
      - description: Search string
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Retrieve a count of Mods
      tags:
      - Mods
  /oauth:
    get:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Retrieve a list of OAuth methods
      tags:
      - OAuth
  /oauth/github:
    get:
      consumes:
      - application/json
      parameters:
      - description: OAuth Code
        in: query
        name: code
        required: true
        type: string
      - description: OAuth Code
        in: query
        name: state
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Callback URL for github OAuth
      tags:
      - OAuth
  /user/{userId}:
    get:
      consumes:
      - application/json
      description: Retrieve a user by user ID
      parameters:
      - description: User ID
        in: path
        name: userId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Retrieve a User
      tags:
      - User
  /user/{userId}/mods:
    get:
      consumes:
      - application/json
      description: Retrieve a users mods by user ID
      parameters:
      - description: User ID
        in: path
        name: userId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Retrieve a Users Mods
      tags:
      - User
  /user/me:
    get:
      consumes:
      - application/json
      description: Retrieve the user associated with the token
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Retrieve Current User
      tags:
      - User
  /user/me/logout:
    get:
      consumes:
      - application/json
      description: Log out the user associated with the token
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Log Out Current User
      tags:
      - User
  /user/me/mods:
    get:
      consumes:
      - application/json
      description: Retrieve the users mods associated with the token
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Retrieve Current Users Mods
      tags:
      - User
  /users/{userIds}:
    get:
      consumes:
      - application/json
      description: Retrieve a list of users by user ID
      parameters:
      - description: User IDs comma-separated
        in: path
        name: userIds
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Retrieve a list of Users
      tags:
      - Users
  /version/{versionId}:
    get:
      consumes:
      - application/json
      description: Retrieve a version by version ID
      parameters:
      - description: Version ID
        in: path
        name: versionId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Retrieve a Version
      tags:
      - Version
  /versions/{versionId}/{target}/download:
    get:
      consumes:
      - application/json
      description: Download a mod version by version ID and TargetName
      parameters:
      - description: Version ID
        in: path
        name: versionId
        required: true
        type: string
      - description: TargetName
        in: path
        name: target
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Download a TargetName
      tags:
      - Version
      - TargetName
  /versions/{versionId}/download:
    get:
      consumes:
      - application/json
      description: Download a mod version by version ID
      parameters:
      - description: Version ID
        in: path
        name: versionId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Download a Version
      tags:
      - Version
swagger: "2.0"
